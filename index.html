<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RussiaSoulRP | RSRP — Официальный форум</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0B0C10; font-family: 'Inter', sans-serif; color: #E0E4F0; padding: 24px 20px; }
        .forum-container { max-width: 1320px; margin: 0 auto; background: #0F1117; border-radius: 28px; overflow: hidden; border: 1px solid rgba(255,215,0,0.15); }
        .forum-header { background: linear-gradient(135deg, #0A0C12 0%, #11141C 100%); padding: 28px 32px; border-bottom: 2px solid #FFD700; }
        .header-top { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 20px; }
        .logo-area h1 { font-size: 2.2rem; font-weight: 800; background: linear-gradient(135deg, #FFD966, #FFB347); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .logo-area p { font-size: 0.85rem; color: #9AA4BF; margin-top: 6px; }
        .badge-rp { background: #1E1F2C; padding: 6px 16px; border-radius: 60px; font-size: 0.8rem; font-weight: 600; color: #FFD966; border: 1px solid rgba(255,215,0,0.3); }
        .forum-nav { padding: 16px 32px; background: #0C0E14; display: flex; flex-wrap: wrap; gap: 28px; border-bottom: 1px solid #20232E; }
        .forum-nav a { color: #C0C9E0; text-decoration: none; font-weight: 600; transition: 0.2s; display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }
        .forum-nav a i { color: #FFD966; }
        .forum-nav a:hover { color: #FFD966; }
        .forum-main { display: flex; flex-wrap: wrap; padding: 28px 32px; gap: 32px; }
        .content-left { flex: 2.2; min-width: 260px; }
        .content-right { flex: 1.2; min-width: 260px; }
        .section-card { background: #13161F; border-radius: 20px; margin-bottom: 28px; border: 1px solid #232732; overflow: hidden; }
        .section-title { background: #1A1E2A; padding: 14px 22px; font-weight: 700; font-size: 1.2rem; border-left: 4px solid #FFD700; display: flex; align-items: center; gap: 10px; }
        .section-title i { color: #FFD966; }
        .category-item { display: flex; justify-content: space-between; align-items: center; padding: 14px 22px; border-bottom: 1px solid #20232F; flex-wrap: wrap; gap: 10px; cursor: pointer; transition: 0.1s; }
        .category-item:hover { background: #191E2B; }
        .cat-info h3 { font-size: 1rem; font-weight: 600; margin-bottom: 4px; }
        .cat-info p { font-size: 0.75rem; color: #8A94B0; }
        .cat-stats { font-size: 0.75rem; background: #0C0F18; padding: 4px 12px; border-radius: 40px; }
        .topics-list { padding: 0 22px; }
        .topic-item { padding: 12px 0; border-bottom: 1px solid #20232F; cursor: pointer; transition: 0.1s; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; }
        .topic-item:hover { background: #191E2B; margin: 0 -22px; padding: 12px 22px; }
        .topic-title { font-weight: 700; margin-bottom: 4px; color: #FFD966; }
        .topic-meta { font-size: 0.7rem; color: #8A94B0; }
        .topic-actions { display: flex; gap: 10px; }
        .topic-actions i { cursor: pointer; color: #8A94B0; transition: 0.2s; font-size: 0.9rem; }
        .topic-actions i:hover { color: #FFD966; }
        .empty-topics { padding: 28px 22px; text-align: center; color: #8A94B0; }
        .forum-footer { background: #090B10; padding: 20px 32px; border-top: 1px solid #20232E; font-size: 0.75rem; text-align: center; color: #6F7A98; }
        .thread-view { background: #13161F; border-radius: 20px; padding: 24px; margin-bottom: 28px; }
        .thread-title { font-size: 1.5rem; font-weight: 700; margin-bottom: 16px; color: #FFD966; }
        .thread-meta { font-size: 0.8rem; color: #8A94B0; margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid #232732; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        .thread-content { color: #C0C9E0; line-height: 1.6; margin-bottom: 24px; white-space: pre-wrap; }
        .back-btn { background: #1E232F; border: none; color: #FFD966; padding: 8px 16px; border-radius: 20px; cursor: pointer; margin-bottom: 20px; display: inline-block; }
        .back-btn:hover { background: #2A3040; }
        .create-topic-btn { background: #FFD96620; border: 1px solid #FFD966; color: #FFD966; padding: 10px 20px; border-radius: 30px; cursor: pointer; margin-top: 16px; font-weight: 600; display: inline-block; }
        .create-topic-btn:hover { background: #FFD96630; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: #13161F; padding: 28px; border-radius: 24px; width: 90%; max-width: 500px; border: 1px solid #FFD966; }
        .modal-content input, .modal-content textarea { width: 100%; padding: 10px; margin: 10px 0; background: #1E232F; border: 1px solid #232732; border-radius: 12px; color: white; font-family: 'Inter', sans-serif; }
        .modal-content button { background: #FFD966; color: #0B0C10; border: none; padding: 10px 20px; border-radius: 30px; cursor: pointer; font-weight: bold; margin-top: 10px; margin-right: 10px; }
        .modal-content button.cancel { background: #3A3F55; color: white; }
        .close-modal { float: right; font-size: 28px; cursor: pointer; color: #FFD966; }
        .server-card { background: linear-gradient(135deg, #1A1E2A, #13161F); border-radius: 16px; padding: 20px; margin-bottom: 16px; border: 1px solid #FFD96640; cursor: pointer; transition: 0.2s; }
        .server-card:hover { border-color: #FFD966; background: #1E2436; transform: translateY(-2px); }
        .server-name { font-size: 1.3rem; font-weight: 800; color: #FFD966; margin-bottom: 8px; }
        .server-status { font-size: 0.75rem; color: #4CAF50; margin-bottom: 12px; }
        .server-desc { font-size: 0.8rem; color: #9AA4BF; }
        .server-subforums { display: flex; gap: 12px; margin-top: 16px; flex-wrap: wrap; }
        .server-sub { background: #0C0F18; padding: 8px 16px; border-radius: 30px; font-size: 0.8rem; cursor: pointer; border: 1px solid #FFD96640; transition: 0.2s; }
        .server-sub:hover { background: #FFD96620; border-color: #FFD966; }
        .voice-card { background: #13161F; border-radius: 20px; padding: 18px; border: 1px solid #2C3040; margin-bottom: 28px; text-align: center; }
        @media (max-width: 800px) { .forum-main { flex-direction: column; } }
    </style>
</head>
<body>
<div class="forum-container">
    <div class="forum-header">
        <div class="header-top">
            <div class="logo-area">
                <h1><i class="fas fa-city"></i> RUSSIA SOUL RP | RSRP</h1>
                <p>Криминальная Москва · GTA 5 RolePlay · Реализм 24/7</p>
            </div>
            <div class="badge-rp"><i class="fas fa-shield-alt"></i> Официальный форум</div>
        </div>
    </div>
    <div class="forum-nav">
        <a data-page="main"><i class="fas fa-home"></i> Главная</a>
        <a data-page="support_tech"><i class="fas fa-headset"></i> Техподдержка</a>
        <a data-page="complaints"><i class="fas fa-file-alt"></i> Жалобы и заявления</a>
    </div>
    <div id="main-content" class="forum-main"></div>
    <div class="forum-footer">
        RussiaSoul RP · Криминальная Москва 2026 · <span style="color:#FFD966;">Официальный форум RSRP</span>
    </div>
</div>
<div id="topicModal" class="modal">
    <div class="modal-content">
        <span class="close-modal">&times;</span>
        <h3 style="color:#FFD966;" id="modalTitle">Создать новую тему</h3>
        <input type="text" id="topicTitle" placeholder="Название темы">
        <textarea id="topicContent" rows="5" placeholder="Текст сообщения..."></textarea>
        <button id="submitTopicBtn">Сохранить</button>
        <button id="cancelModalBtn" class="cancel">Отмена</button>
    </div>
</div>
<script>
    var DISQUS_SHORTNAME = "rsrp-forum";
    var currentEditCategory = null;
    var currentEditTopicId = null;
    var currentBackCallback = null;
    
    var forumSections = [
        { id: "rules_common", name: "Общие правила проекта", desc: "Основные правила поведения на сервере", icon: "fas fa-gavel" },
        { id: "rules_criminal", name: "Общие правила криминальных организаций", desc: "Правила для банд, мафии и криминала", icon: "fas fa-skull" },
        { id: "rules_gov", name: "Общие правила государственных организаций", desc: "Правила для полиции, мэрии, госструктур", icon: "fas fa-building" }
    ];
    
    var serverKhimkiSubs = [
        { id: "khimki_criminal", name: "Криминальные организации", desc: "Банды, мафия, криминальные семьи", icon: "fas fa-mask" },
        { id: "khimki_gov", name: "Государственные организации", desc: "Полиция, мэрия, скорая, пожарные", icon: "fas fa-landmark" }
    ];
    
    var techSupport = [
        { id: "tech_help", name: "Помощь", desc: "Вопросы по игре, помощь новичкам", icon: "fas fa-question-circle" },
        { id: "tech_bugs", name: "Сообщить о баге", desc: "Ошибки, глитчи, проблемы с сервером", icon: "fas fa-bug" },
        { id: "tech_support", name: "Техподдержка", desc: "Связь с администрацией по тех. вопросам", icon: "fas fa-headset" }
    ];
    
    var complaints = [
        { id: "complaint_admin", name: "Жалобы на администрацию", desc: "Нарушения со стороны админов", icon: "fas fa-user-shield" },
        { id: "complaint_players", name: "Жалобы на игроков", desc: "Нарушения правил игроками", icon: "fas fa-users" },
        { id: "complaint_leaders", name: "Жалобы на лидеров", desc: "Нарушения лидеров организаций", icon: "fas fa-crown" },
        { id: "amnesty", name: "Заявление на амнистию", desc: "Просьба о смягчении наказания", icon: "fas fa-hand-peace" },
        { id: "moderator_app", name: "Заявление на пост модератора", desc: "Подать заявку в модерацию", icon: "fas fa-user-tie" },
        { id: "leader_app", name: "Заявление на пост лидера", desc: "Подать заявку на лидерство", icon: "fas fa-chart-line" }
    ];
    
    var forumTopics = {};
    
    function loadTopics() {
        var saved = localStorage.getItem("rsrp_forum_final_working");
        if (saved) { forumTopics = JSON.parse(saved); }
        else {
            var all = [];
            for (var i = 0; i < forumSections.length; i++) all.push(forumSections[i].id);
            for (var i = 0; i < serverKhimkiSubs.length; i++) all.push(serverKhimkiSubs[i].id);
            for (var i = 0; i < techSupport.length; i++) all.push(techSupport[i].id);
            for (var i = 0; i < complaints.length; i++) all.push(complaints[i].id);
            for (var i = 0; i < all.length; i++) forumTopics[all[i]] = [];
        }
    }
    function saveTopics() { localStorage.setItem("rsrp_forum_final_working", JSON.stringify(forumTopics)); }
    function getTopicsByCategory(cat) { if (!forumTopics[cat]) forumTopics[cat] = []; return forumTopics[cat]; }
    function addTopic(cat, title, content) {
        if (!forumTopics[cat]) forumTopics[cat] = [];
        var newTopic = { id: 'topic_' + Date.now(), title: title, author: 'Игрок', date: new Date().toLocaleDateString(), content: content, replies: 0 };
        forumTopics[cat].push(newTopic); saveTopics(); return newTopic;
    }
    function updateTopic(cat, id, title, content) {
        var topics = forumTopics[cat];
        if (topics) { for (var i = 0; i < topics.length; i++) { if (topics[i].id == id) { topics[i].title = title; topics[i].content = content; saveTopics(); return true; } } }
        return false;
    }
    function deleteTopic(cat, id) {
        var topics = forumTopics[cat];
        if (topics) { for (var i = 0; i < topics.length; i++) { if (topics[i].id == id) { topics.splice(i, 1); saveTopics(); return true; } } }
        return false;
    }
    function loadDisqus(id, title) {
        if (window.DISQUS) { window.DISQUS.reset({ reload: true, config: function() { this.page.identifier = id; this.page.url = window.location.href.split('#')[0] + '#!' + id; this.page.title = title; } }); }
        else { var dsq = document.createElement('script'); dsq.type = 'text/javascript'; dsq.async = true; dsq.src = '//' + DISQUS_SHORTNAME + '.disqus.com/embed.js'; document.head.appendChild(dsq); }
    }
    function renderTopicsList(cat, title, backCallback) {
        var topics = getTopicsByCategory(cat);
        var container = document.getElementById('main-content');
        var html = '<div class="content-left" style="width:100%"><button class="back-btn" onclick="(' + backCallback.toString() + ')()"><i class="fas fa-arrow-left"></i> Назад</button>';
        html += '<div class="section-card"><div class="section-title"><i class="fas fa-folder-open"></i> ' + title + '</div><div class="topics-list">';
        if (topics.length === 0) { html += '<div class="empty-topics"><i class="fas fa-inbox"></i><p>Нет тем</p></div>'; }
        else { for (var i = 0; i < topics.length; i++) { var t = topics[i]; html += '<div class="topic-item" data-topic="' + t.id + '" data-title="' + t.title.replace(/"/g, '&quot;') + '"><div style="flex:1"><div class="topic-title">' + t.title + '</div><div class="topic-meta"><i class="fas fa-user"></i> ' + t.author + ' · ' + t.date + ' · ответов: ' + t.replies + '</div></div><div class="topic-actions"><i class="fas fa-edit" title="Редактировать" data-action="edit"></i><i class="fas fa-trash-alt" title="Удалить" data-action="delete"></i></div></div>'; } }
        html += '</div><div style="padding:16px 22px;"><button class="create-topic-btn" data-cat="' + cat + '"><i class="fas fa-plus"></i> Создать тему</button></div></div></div>';
        container.innerHTML = html;
        document.querySelectorAll('.topic-item').forEach(function(el) { var tid = el.dataset.topic; var ttl = el.dataset.title; el.querySelector('.topic-title')?.addEventListener('click', function(e) { e.stopPropagation(); showThread(cat, tid, ttl); }); el.querySelector('[data-action="edit"]')?.addEventListener('click', function(e) { e.stopPropagation(); openEditModal(cat, tid); }); el.querySelector('[data-action="delete"]')?.addEventListener('click', function(e) { e.stopPropagation(); if (confirm('Удалить тему?')) { deleteTopic(cat, tid); renderTopicsList(cat, title, backCallback); } }); });
        document.querySelector('.create-topic-btn')?.addEventListener('click', function(e) { openCreateModal(e.target.dataset.cat, backCallback); });
    }
    function showThread(cat, tid, ttl) {
        var topics = getTopicsByCategory(cat); var topic = null; for (var i = 0; i < topics.length; i++) { if (topics[i].id == tid) { topic = topics[i]; break; } }
        var container = document.getElementById('main-content');
        var html = '<div class="content-left" style="width:100%"><button class="back-btn" onclick="location.reload()"><i class="fas fa-arrow-left"></i> Назад</button><div class="thread-view">';
        if (topic) { html += '<div class="thread-title">' + topic.title + '</div><div class="thread-meta"><span><i class="fas fa-user"></i> ' + topic.author + ' · ' + topic.date + '</span><div class="topic-actions"><i class="fas fa-edit" style="cursor:pointer;" id="editThreadBtn"></i><i class="fas fa-trash-alt" style="cursor:pointer; margin-left:12px;" id="deleteThreadBtn"></i></div></div><div class="thread-content">' + (topic.content || '').replace(/\n/g, '<br>') + '</div>'; }
        html += '<div id="disqus_thread"></div></div></div>';
        container.innerHTML = html;
        if (topic) { document.getElementById('editThreadBtn')?.addEventListener('click', function() { openEditModal(cat, tid); }); document.getElementById('deleteThreadBtn')?.addEventListener('click', function() { if (confirm('Удалить тему?')) { deleteTopic(cat, tid); showMainPage(); } }); }
        loadDisqus(tid, ttl);
    }
    function openCreateModal(cat, cb) { currentEditCategory = cat; currentEditTopicId = null; currentBackCallback = cb; document.getElementById('modalTitle').innerText = 'Создать тему'; document.getElementById('topicTitle').value = ''; document.getElementById('topicContent').value = ''; document.getElementById('topicModal').style.display = 'flex'; }
    function openEditModal(cat, id) { var topics = getTopicsByCategory(cat); var topic = null; for (var i = 0; i < topics.length; i++) { if (topics[i].id == id) { topic = topics[i]; break; } } if (topic) { currentEditCategory = cat; currentEditTopicId = id; document.getElementById('modalTitle').innerText = 'Редактировать тему'; document.getElementById('topicTitle').value = topic.title; document.getElementById('topicContent').value = topic.content; document.getElementById('topicModal').style.display = 'flex'; } }
    function closeModal() { document.getElementById('topicModal').style.display = 'none'; currentEditCategory = null; currentEditTopicId = null; }
    function showMainPage() {
        loadTopics();
        var container = document.getElementById('main-content');
        var html = '<div class="content-left"><div class="section-card"><div class="section-title"><i class="fas fa-server"></i> Игровые сервера</div><div class="server-card" id="khimkiServerBtn"><div class="server-name"><i class="fas fa-star-of-life"></i> Сервер №1 | Химки</div><div class="server-status"><i class="fas fa-circle" style="color:#4CAF50; font-size:0.6rem;"></i> Онлайн</div><div class="server-desc">Основной сервер проекта. Криминальная Москва, высокий реализм.</div><div class="server-subforums"><div class="server-sub" data-sub="khimki_criminal"><i class="fas fa-mask"></i> Криминальные организации</div><div class="server-sub" data-sub="khimki_gov"><i class="fas fa-landmark"></i> Государственные организации</div></div></div></div><div class="section-card"><div class="section-title"><i class="fas fa-layer-group"></i> Разделы форума</div><div class="category-list">';
        for (var i = 0; i < forumSections.length; i++) { var s = forumSections[i]; var cnt = getTopicsByCategory(s.id).length; html += '<div class="category-item" data-category="' + s.id + '"><div class="cat-info"><h3><i class="' + s.icon + '"></i> ' + s.name + '</h3><p>' + s.desc + '</p></div><div class="cat-stats"><i class="fas fa-file-alt"></i> Тем: ' + cnt + '</div></div>'; }
        html += '</div></div></div><div class="content-right"><div class="voice-card"><i class="fas fa-microphone-alt"></i> <strong>Голосовое объединение</strong><div style="margin-top: 10px; color:#8A94B0;">Подключитесь к Discord</div></div></div>';
        container.innerHTML = html;
        document.querySelectorAll('.category-item[data-category]').forEach(function(el) { el.addEventListener('click', function() { showCategory(el.dataset.category); }); });
        document.querySelectorAll('.server-sub').forEach(function(el) { el.addEventListener('click', function(e) { e.stopPropagation(); showServerSub(el.dataset.sub); }); });
        document.getElementById('khimkiServerBtn')?.addEventListener('click', function() { showServerPage(); });
    }
    function showCategory(id) { for (var i = 0; i < forumSections.length; i++) { if (forumSections[i].id == id) { renderTopicsList(id, forumSections[i].name, showMainPage); break; } } }
    function showServerPage() {
        var container = document.getElementById('main-content');
        var html = '<div class="content-left" style="width:100%"><button class="back-btn" onclick="showMainPage()"><i class="fas fa-arrow-left"></i> Назад</button><div class="section-card"><div class="section-title"><i class="fas fa-server"></i> Сервер №1 | Химки</div><div class="category-list">';
        for (var i = 0; i < serverKhimkiSubs.length; i++) { var s = serverKhimkiSubs[i]; var cnt = getTopicsByCategory(s.id).length; html += '<div class="category-item" data-sub="' + s.id + '"><div class="cat-info"><h3><i class="' + s.icon + '"></i> ' + s.name + '</h3><p>' + s.desc + '</p></div><div class="cat-stats"><i class="fas fa-file-alt"></i> Тем: ' + cnt + '</div></div>'; }
        html += '</div></div></div>';
        container.innerHTML = html;
        document.querySelectorAll('.category-item[data-sub]').forEach(function(el) { el.addEventListener('click', function() { showServerSub(el.dataset.sub); }); });
    }
    function showServerSub(id) { for (var i = 0; i < serverKhimkiSubs.length; i++) { if (serverKhimkiSubs[i].id == id) { renderTopicsList(id, serverKhimkiSubs[i].name + ' - Сервер Химки', showServerPage); break; } } }
    function showTechSupportPage() {
        var container = document.getElementById('main-content');
        var html = '<div class="content-left" style="width:100%"><button class="back-btn" onclick="showMainPage()"><i class="fas fa-arrow-left"></i> Назад</button><div class="section-card"><div class="section-title"><i class="fas fa-headset"></i> Техническая поддержка</div><div class="category-list">';
        for (var i = 0; i < techSupport.length; i++) { var t = techSupport[i]; var cnt = getTopicsByCategory(t.id).length; html += '<div class="category-item" data-tech="' + t.id + '"><div class="cat-info"><h3><i class="' + t.icon + '"></i> ' + t.name + '</h3><p>' + t.desc + '</p></div><div class="cat-stats"><i class="fas fa-file-alt"></i> Тем: ' + cnt + '</div></div>'; }
        html += '</div></div></div>';
        container.innerHTML = html;
        document.querySelectorAll('.category-item[data-tech]').forEach(function(el) { el.addEventListener('click', function() { showTechCategory(el.dataset.tech); }); });
    }
    function showTechCategory(id) { for (var i = 0; i < techSupport.length; i++) { if (techSupport[i].id == id) { renderTopicsList(id, techSupport[i].name, showTechSupportPage); break; } } }
    function showComplaints() {
        var container = document.getElementById('main-content');
        var html = '<div class="content-left" style="width:100%"><button class="back-btn" onclick="showMainPage()"><i class="fas fa-arrow-left"></i> Назад</button><div class="section-card"><div class="section-title"><i class="fas fa-file-alt"></i> Жалобы и заявления</div><div class="category-list">';
        for (var i = 0; i < complaints.length; i++) { var c = complaints[i]; var cnt = getTopicsByCategory(c.id).length; html += '<div class="category-item" data-complaint="' + c.id + '"><div class="cat-info"><h3><i class="' + c.icon + '"></i> ' + c.name + '</h3><p>' + c.desc + '</p></div><div class="cat-stats"><i class="fas fa-file-alt"></i> Тем: ' + cnt + '</div></div>'; }
        html += '</div></div></div>';
        container.innerHTML = html;
        document.querySelectorAll('.category-item[data-complaint]').forEach(function(el) { el.addEventListener('click', function() { showComplaintCategory(el.dataset.complaint); }); });
    }
    function showComplaintCategory(id) { for (var i = 0; i < complaints.length; i++) { if (complaints[i].id == id) { renderTopicsList(id, complaints[i].name, showComplaints); break; } } }
    document.querySelectorAll('.forum-nav a').forEach(function(btn) { btn.addEventListener('click', function() { if (btn.dataset.page === 'main') showMainPage(); if (btn.dataset.page === 'support_tech') showTechSupportPage(); if (btn.dataset.page === 'complaints') showComplaints(); }); });
    document.querySelector('.close-modal')?.addEventListener('click', closeModal);
    document.getElementById('cancelModalBtn')?.addEventListener('click', closeModal);
    window.onclick = function(e) { if (e.target == document.getElementById('topicModal')) closeModal(); };
    document.getElementById('submitTopicBtn')?.addEventListener('click', function() { var title = document.getElementById('topicTitle').value.trim(); var content = document.getElementById('topicContent').value.trim(); if (!title || !content) { alert('Заполните поля'); return; } if (!currentEditCategory) return; if (currentEditTopicId) { updateTopic(currentEditCategory, currentEditTopicId, title, content); } else { addTopic(currentEditCategory, title, content); } closeModal(); if (currentBackCallback) currentBackCallback(); else showMainPage(); });
    loadTopics(); showMainPage();
</script>
</body>
</html>
