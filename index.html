<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RussiaSoulRP | RSRP — Форум</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0B0C10; font-family: 'Inter', sans-serif; color: #E0E4F0; padding: 24px 20px; }
        .forum-container { max-width: 1320px; margin: 0 auto; background: #0F1117; border-radius: 28px; overflow: hidden; border: 1px solid rgba(255,215,0,0.15); }
        .forum-header { background: linear-gradient(135deg, #0A0C12 0%, #11141C 100%); padding: 28px 32px; border-bottom: 2px solid #FFD700; }
        .header-top { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 20px; }
        .logo-area h1 { font-size: 2.2rem; font-weight: 800; background: linear-gradient(135deg, #FFD966, #FFB347); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .logo-area p { font-size: 0.85rem; color: #9AA4BF; margin-top: 6px; }
        .badge-rp { background: #1E1F2C; padding: 6px 16px; border-radius: 60px; font-size: 0.8rem; font-weight: 600; color: #FFD966; border: 1px solid rgba(255,215,0,0.3); }
        .forum-nav { padding: 16px 32px; background: #0C0E14; display: flex; flex-wrap: wrap; gap: 28px; border-bottom: 1px solid #20232E; }
        .forum-nav a { color: #C0C9E0; text-decoration: none; font-weight: 600; transition: 0.2s; display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }
        .forum-nav a i { color: #FFD966; }
        .forum-nav a:hover { color: #FFD966; }
        .forum-main { display: flex; flex-wrap: wrap; padding: 28px 32px; gap: 32px; }
        .content-left { flex: 2.2; min-width: 260px; }
        .content-right { flex: 1.2; min-width: 260px; }
        .section-card { background: #13161F; border-radius: 20px; margin-bottom: 28px; border: 1px solid #232732; overflow: hidden; }
        .section-title { background: #1A1E2A; padding: 14px 22px; font-weight: 700; font-size: 1.2rem; border-left: 4px solid #FFD700; display: flex; align-items: center; gap: 10px; justify-content: space-between; flex-wrap: wrap; }
        .section-title i { color: #FFD966; }
        .add-section-btn { background: #FFD96620; border: 1px solid #FFD966; color: #FFD966; padding: 4px 12px; border-radius: 20px; font-size: 0.7rem; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
        .category-item { display: flex; justify-content: space-between; align-items: center; padding: 14px 22px; border-bottom: 1px solid #20232F; flex-wrap: wrap; gap: 10px; cursor: pointer; transition: 0.1s; }
        .category-item:hover { background: #191E2B; }
        .cat-info h3 { font-size: 1rem; font-weight: 600; margin-bottom: 4px; }
        .cat-info p { font-size: 0.75rem; color: #8A94B0; }
        .cat-stats { font-size: 0.75rem; background: #0C0F18; padding: 4px 12px; border-radius: 40px; }
        .cat-actions { display: flex; gap: 8px; }
        .cat-actions i { cursor: pointer; color: #8A94B0; }
        .cat-actions i:hover { color: #FFD966; }
        .topics-list { padding: 0 22px; }
        .topic-item { padding: 12px 0; border-bottom: 1px solid #20232F; cursor: pointer; transition: 0.1s; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; }
        .topic-item:hover { background: #191E2B; margin: 0 -22px; padding: 12px 22px; }
        .topic-title { font-weight: 700; margin-bottom: 4px; color: #FFD966; }
        .topic-meta { font-size: 0.7rem; color: #8A94B0; }
        .topic-actions { display: flex; gap: 10px; }
        .topic-actions i { cursor: pointer; color: #8A94B0; }
        .topic-actions i:hover { color: #FFD966; }
        .empty-topics { padding: 28px 22px; text-align: center; color: #8A94B0; }
        .forum-footer { background: #090B10; padding: 20px 32px; border-top: 1px solid #20232E; font-size: 0.75rem; text-align: center; color: #6F7A98; }
        .thread-view { background: #13161F; border-radius: 20px; padding: 24px; margin-bottom: 28px; }
        .thread-title { font-size: 1.5rem; font-weight: 700; margin-bottom: 16px; color: #FFD966; }
        .thread-meta { font-size: 0.8rem; color: #8A94B0; margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid #232732; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        .thread-content { color: #C0C9E0; line-height: 1.6; margin-bottom: 24px; white-space: pre-wrap; }
        .back-btn { background: #1E232F; border: none; color: #FFD966; padding: 8px 16px; border-radius: 20px; cursor: pointer; margin-bottom: 20px; display: inline-block; }
        .create-topic-btn { background: #FFD96620; border: 1px solid #FFD966; color: #FFD966; padding: 8px 16px; border-radius: 30px; cursor: pointer; margin-top: 16px; font-weight: 600; display: inline-block; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: #13161F; padding: 28px; border-radius: 24px; width: 90%; max-width: 500px; border: 1px solid #FFD966; }
        .modal-content input, .modal-content textarea { width: 100%; padding: 10px; margin: 10px 0; background: #1E232F; border: 1px solid #232732; border-radius: 12px; color: white; font-family: 'Inter', sans-serif; }
        .modal-content button { background: #FFD966; color: #0B0C10; border: none; padding: 10px 20px; border-radius: 30px; cursor: pointer; font-weight: bold; margin-top: 10px; margin-right: 10px; }
        .modal-content button.cancel { background: #3A3F55; color: white; }
        .close-modal { float: right; font-size: 28px; cursor: pointer; color: #FFD966; }
        .server-card { background: linear-gradient(135deg, #1A1E2A, #13161F); border-radius: 16px; padding: 20px; margin: 16px 20px; border: 1px solid #FFD96640; cursor: pointer; transition: 0.2s; }
        .server-card:hover { border-color: #FFD966; background: #1E2436; }
        .server-name { font-size: 1.3rem; font-weight: 800; color: #FFD966; margin-bottom: 8px; }
        .server-status { font-size: 0.75rem; color: #4CAF50; margin-bottom: 12px; }
        .voice-card { background: #13161F; border-radius: 20px; padding: 18px; border: 1px solid #2C3040; margin-bottom: 28px; text-align: center; }
        @media (max-width: 800px) { .forum-main { flex-direction: column; } }
    </style>
</head>
<body>
<div class="forum-container">
    <div class="forum-header">
        <div class="header-top">
            <div class="logo-area"><h1><i class="fas fa-city"></i> RUSSIA SOUL RP | RSRP</h1><p>Криминальная Москва · GTA 5 RolePlay · Реализм 24/7</p></div>
            <div class="badge-rp"><i class="fas fa-shield-alt"></i> Официальный форум</div>
        </div>
    </div>
    <div class="forum-nav">
        <a onclick="showMain()"><i class="fas fa-home"></i> Главная</a>
        <a onclick="showTech()"><i class="fas fa-headset"></i> Техподдержка</a>
        <a onclick="showComplaints()"><i class="fas fa-file-alt"></i> Жалобы и заявления</a>
    </div>
    <div id="main-content" class="forum-main"></div>
    <div class="forum-footer">RussiaSoul RP · Криминальная Москва 2026 · <span style="color:#FFD966;">Официальный форум RSRP</span></div>
</div>

<div id="topicModal" class="modal"><div class="modal-content"><span class="close-modal" onclick="closeModal()">&times;</span><h3 id="modalTitle" style="color:#FFD966;">Создать тему</h3><input type="text" id="topicTitle" placeholder="Название темы"><textarea id="topicContent" rows="5" placeholder="Текст сообщения..."></textarea><button id="submitTopicBtn">Сохранить</button><button class="cancel" onclick="closeModal()">Отмена</button></div></div>
<div id="sectionModal" class="modal"><div class="modal-content"><span class="close-modal" onclick="closeModal()">&times;</span><h3 style="color:#FFD966;">Добавить раздел</h3><input type="text" id="sectionName" placeholder="Название раздела"><textarea id="sectionDesc" rows="3" placeholder="Описание"></textarea><button id="submitSectionBtn">Сохранить</button><button class="cancel" onclick="closeModal()">Отмена</button></div></div>

<script>
var DISQUS_SHORTNAME = "rsrp-forum";
var currentCategory = null, currentTopicId = null, currentBack = null;

var forumSections = [
    { id: "rules_common", name: "Общие правила проекта", desc: "Основные правила поведения", icon: "fas fa-gavel" },
    { id: "rules_criminal", name: "Общие правила криминальных организаций", desc: "Правила для банд и мафии", icon: "fas fa-skull" },
    { id: "rules_gov", name: "Общие правила государственных организаций", desc: "Правила для полиции и госструктур", icon: "fas fa-building" }
];

var baseSubs = [
    { id: "khimki_criminal", name: "Криминальные организации", desc: "Банды, мафия, криминальные семьи", icon: "fas fa-mask", removable: false },
    { id: "khimki_gov", name: "Государственные организации", desc: "Полиция, мэрия, скорая, пожарные", icon: "fas fa-landmark", removable: false }
];

var tech = [
    { id: "tech_help", name: "Помощь", desc: "Вопросы по игре", icon: "fas fa-question-circle" },
    { id: "tech_bugs", name: "Сообщить о баге", desc: "Ошибки и проблемы", icon: "fas fa-bug" },
    { id: "tech_support", name: "Техподдержка", desc: "Связь с администрацией", icon: "fas fa-headset" }
];

var complaintsList = [
    { id: "complaint_admin", name: "Жалобы на администрацию", desc: "Нарушения админов", icon: "fas fa-user-shield" },
    { id: "complaint_players", name: "Жалобы на игроков", desc: "Нарушения правил игроками", icon: "fas fa-users" },
    { id: "complaint_leaders", name: "Жалобы на лидеров", desc: "Нарушения лидеров", icon: "fas fa-crown" },
    { id: "amnesty", name: "Заявление на амнистию", desc: "Смягчение наказания", icon: "fas fa-hand-peace" },
    { id: "moderator_app", name: "Заявление на пост модератора", desc: "Заявка в модерацию", icon: "fas fa-user-tie" },
    { id: "leader_app", name: "Заявление на пост лидера", desc: "Заявка на лидерство", icon: "fas fa-chart-line" }
];

var customSubs = [];
var topics = {};

function loadData() {
    var saved = localStorage.getItem("rsrp_data_v4");
    if(saved) topics = JSON.parse(saved);
    else {
        var all = [];
        forumSections.forEach(s=>all.push(s.id));
        baseSubs.forEach(s=>all.push(s.id));
        tech.forEach(t=>all.push(t.id));
        complaintsList.forEach(c=>all.push(c.id));
        all.forEach(id=>topics[id]=[]);
    }
    var savedCustom = localStorage.getItem("rsrp_custom_v4");
    if(savedCustom) customSubs = JSON.parse(savedCustom);
}
function saveTopics() { localStorage.setItem("rsrp_data_v4", JSON.stringify(topics)); }
function saveCustom() { localStorage.setItem("rsrp_custom_v4", JSON.stringify(customSubs)); }

function getTopics(cat) { if(!topics[cat]) topics[cat]=[]; return topics[cat]; }
function getAllSubs() { return baseSubs.concat(customSubs); }

function addCustom(name, desc) {
    var id = "c_" + Date.now();
    customSubs.push({ id:id, name:name, desc:desc, icon:"fas fa-folder", removable:true });
    saveCustom();
    if(!topics[id]) topics[id]=[];
    saveTopics();
}
function delCustom(id) {
    var idx = customSubs.findIndex(s=>s.id==id);
    if(idx!==-1){ customSubs.splice(idx,1); saveCustom(); delete topics[id]; saveTopics(); }
}

function addTopic(cat, title, content) {
    if(!topics[cat]) topics[cat]=[];
    topics[cat].push({ id:"t_"+Date.now(), title:title, author:"Игрок", date:new Date().toLocaleDateString(), content:content });
    saveTopics();
}
function updTopic(cat, id, title, content) {
    var arr = topics[cat];
    if(arr) for(var i=0;i<arr.length;i++) if(arr[i].id==id){ arr[i].title=title; arr[i].content=content; saveTopics(); return; }
}
function delTopic(cat, id) {
    var arr = topics[cat];
    if(arr) for(var i=0;i<arr.length;i++) if(arr[i].id==id){ arr.splice(i,1); saveTopics(); return; }
}

function showMain() {
    loadData();
    var html = '<div class="content-left"><div class="section-card"><div class="section-title"><i class="fas fa-server"></i> Игровые сервера</div><div class="server-card" onclick="showServer()"><div class="server-name"><i class="fas fa-star-of-life"></i> Сервер №1 | Химки</div><div class="server-status"><i class="fas fa-circle" style="color:#4CAF50; font-size:0.6rem;"></i> Онлайн</div></div></div><div class="section-card"><div class="section-title"><i class="fas fa-layer-group"></i> Разделы форума</div><div class="category-list">';
    for(var i=0;i<forumSections.length;i++){ var s=forumSections[i]; var cnt=getTopics(s.id).length; html+='<div class="category-item" onclick="showCategory(\''+s.id+'\')"><div class="cat-info"><h3><i class="'+s.icon+'"></i> '+s.name+'</h3><p>'+s.desc+'</p></div><div class="cat-stats"><i class="fas fa-file-alt"></i> Тем: '+cnt+'</div></div>'; }
    html+='</div></div></div><div class="content-right"><div class="voice-card"><i class="fas fa-microphone-alt"></i> <strong>Голосовое объединение</strong><div style="margin-top:10px">Подключитесь к Discord</div></div></div>';
    document.getElementById('main-content').innerHTML = html;
}

function showServer() {
    var subs = getAllSubs();
    var html = '<div class="content-left" style="width:100%"><button class="back-btn" onclick="showMain()"><i class="fas fa-arrow-left"></i> Назад</button><div class="section-card"><div class="section-title"><i class="fas fa-server"></i> Сервер №1 | Химки <span class="add-section-btn" onclick="document.getElementById(\'sectionModal\').style.display=\'flex\'"><i class="fas fa-plus"></i> Добавить раздел</span></div><div class="category-list">';
    for(var i=0;i<subs.length;i++){ var s=subs[i]; var cnt=getTopics(s.id).length; html+='<div class="category-item"><div class="cat-info" onclick="showSub(\''+s.id+'\')"><h3><i class="'+s.icon+'"></i> '+s.name+'</h3><p>'+s.desc+'</p></div><div class="cat-stats"><i class="fas fa-file-alt"></i> Тем: '+cnt+'</div>'+(s.removable?'<div class="cat-actions"><i class="fas fa-trash-alt" onclick="event.stopPropagation(); if(confirm(\'Удалить?\')){ delCustom(\''+s.id+'\'); showServer(); }"></i></div>':'')+'</div>'; }
    html+='</div></div></div>';
    document.getElementById('main-content').innerHTML = html;
}

function showSub(id) {
    var subs = getAllSubs();
    var s = subs.find(x=>x.id==id);
    if(s) renderTopics(id, s.name + ' - Химки', showServer);
}

function showCategory(id) {
    var s = forumSections.find(x=>x.id==id);
    if(s) renderTopics(id, s.name, showMain);
}

function renderTopics(cat, title, back) {
    var arr = getTopics(cat);
    var html = '<div class="content-left" style="width:100%"><button class="back-btn" onclick="('+back.toString()+')()"><i class="fas fa-arrow-left"></i> Назад</button><div class="section-card"><div class="section-title"><i class="fas fa-folder-open"></i> '+title+'</div><div class="topics-list">';
    if(arr.length===0) html+='<div class="empty-topics"><i class="fas fa-inbox"></i><p>Нет тем</p></div>';
    else for(var i=0;i<arr.length;i++){ var t=arr[i]; html+='<div class="topic-item"><div style="flex:1" onclick="showThread(\''+cat+'\',\''+t.id+'\',\''+t.title.replace(/'/g,"\\'")+'\')"><div class="topic-title">'+t.title+'</div><div class="topic-meta"><i class="fas fa-user"></i> '+t.author+' · '+t.date+'</div></div><div class="topic-actions"><i class="fas fa-edit" onclick="event.stopPropagation(); openEdit(\''+cat+'\',\''+t.id+'\',\''+back.toString()+'\')"></i><i class="fas fa-trash-alt" onclick="event.stopPropagation(); if(confirm(\'Удалить?\')){ delTopic(\''+cat+'\',\''+t.id+'\'); renderTopics(\''+cat+'\',\''+title+'\','+back.toString()+'); }"></i></div></div>'; }
    html+='</div><div style="padding:16px 22px;"><button class="create-topic-btn" onclick="openCreate(\''+cat+'\',\''+back.toString()+'\')"><i class="fas fa-plus"></i> Создать тему</button></div></div></div>';
    document.getElementById('main-content').innerHTML = html;
}

function showThread(cat, id, title) {
    var arr = getTopics(cat);
    var topic = arr.find(x=>x.id==id);
    var html = '<div class="content-left" style="width:100%"><button class="back-btn" onclick="location.reload()"><i class="fas fa-arrow-left"></i> Назад</button><div class="thread-view">';
    if(topic) html+='<div class="thread-title">'+topic.title+'</div><div class="thread-meta"><span><i class="fas fa-user"></i> '+topic.author+' · '+topic.date+'</span><div class="topic-actions"><i class="fas fa-edit" onclick="openEdit(\''+cat+'\',\''+id+'\',null)"></i><i class="fas fa-trash-alt" onclick="if(confirm(\'Удалить?\')){ delTopic(\''+cat+'\',\''+id+'\'); showMain(); }"></i></div></div><div class="thread-content">'+(topic.content||'').replace(/\n/g,'<br>')+'</div>';
    html+='<div id="disqus_thread"></div></div></div>';
    document.getElementById('main-content').innerHTML = html;
    if(window.DISQUS) window.DISQUS.reset({reload:true,config:function(){ this.page.identifier=id; this.page.url=window.location.href.split('#')[0]+'#!'+id; this.page.title=title; }});
    else{ var d=document.createElement('script'); d.type='text/javascript'; d.async=true; d.src='//'+DISQUS_SHORTNAME+'.disqus.com/embed.js'; document.head.appendChild(d); }
}

function openCreate(cat, back) { currentCategory=cat; currentTopicId=null; currentBack=back; document.getElementById('modalTitle').innerText='Создать тему'; document.getElementById('topicTitle').value=''; document.getElementById('topicContent').value=''; document.getElementById('topicModal').style.display='flex'; }
function openEdit(cat, id, back) { var arr=getTopics(cat); var t=arr.find(x=>x.id==id); if(t){ currentCategory=cat; currentTopicId=id; currentBack=back; document.getElementById('modalTitle').innerText='Редактировать тему'; document.getElementById('topicTitle').value=t.title; document.getElementById('topicContent').value=t.content; document.getElementById('topicModal').style.display='flex'; } }
function closeModal() { document.getElementById('topicModal').style.display='none'; document.getElementById('sectionModal').style.display='none'; }

function showTech() {
    var html = '<div class="content-left" style="width:100%"><button class="back-btn" onclick="showMain()"><i class="fas fa-arrow-left"></i> Назад</button><div class="section-card"><div class="section-title"><i class="fas fa-headset"></i> Техническая поддержка</div><div class="category-list">';
    for(var i=0;i<tech.length;i++){ var t=tech[i]; var cnt=getTopics(t.id).length; html+='<div class="category-item" onclick="renderTopics(\''+t.id+'\',\''+t.name+'\',showTech)"><div class="cat-info"><h3><i class="'+t.icon+'"></i> '+t.name+'</h3><p>'+t.desc+'</p></div><div class="cat-stats"><i class="fas fa-file-alt"></i> Тем: '+cnt+'</div></div>'; }
    html+='</div></div></div>';
    document.getElementById('main-content').innerHTML = html;
}

function showComplaints() {
    var html = '<div class="content-left" style="width:100%"><button class="back-btn" onclick="showMain()"><i class="fas fa-arrow-left"></i> Назад</button><div class="section-card"><div class="section-title"><i class="fas fa-file-alt"></i> Жалобы и заявления</div><div class="category-list">';
    for(var i=0;i<complaintsList.length;i++){ var c=complaintsList[i]; var cnt=getTopics(c.id).length; html+='<div class="category-item" onclick="renderTopics(\''+c.id+'\',\''+c.name+'\',showComplaints)"><div class="cat-info"><h3><i class="'+c.icon+'"></i> '+c.name+'</h3><p>'+c.desc+'</p></div><div class="cat-stats"><i class="fas fa-file-alt"></i> Тем: '+cnt+'</div></div>'; }
    html+='</div></div></div>';
    document.getElementById('main-content').innerHTML = html;
}

document.getElementById('submitTopicBtn').onclick = function() {
    var title = document.getElementById('topicTitle').value.trim();
    var content = document.getElementById('topicContent').value.trim();
    if(!title||!content){ alert('Заполните поля'); return; }
    if(currentTopicId) updTopic(currentCategory, currentTopicId, title, content);
    else addTopic(currentCategory, title, content);
    closeModal();
    if(currentBack) currentBack();
    else showMain();
};
document.getElementById('submitSectionBtn').onclick = function() {
    var name = document.getElementById('sectionName').value.trim();
    var desc = document.getElementById('sectionDesc').value.trim();
    if(!name){ alert('Введите название'); return; }
    addCustom(name, desc||'Пользовательский раздел');
    closeModal();
    showServer();
};

loadData();
showMain();
</script>
</body>
</html>
