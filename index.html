<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>RussiaSoulRP | RSRP — Официальный форум (Google Sheets БД)</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0B0C10; font-family: 'Inter', sans-serif; color: #E0E4F0; padding: 24px 20px; }
        .forum-container { max-width: 1320px; margin: 0 auto; background: #0F1117; border-radius: 28px; overflow: hidden; border: 1px solid rgba(255,215,0,0.15); }
        .forum-header { background: linear-gradient(135deg, #0A0C12 0%, #11141C 100%); padding: 28px 32px; border-bottom: 2px solid #FFD700; }
        .header-top { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 20px; }
        .logo-area h1 { font-size: 2.2rem; font-weight: 800; background: linear-gradient(135deg, #FFD966, #FFB347); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .logo-area p { font-size: 0.85rem; color: #9AA4BF; margin-top: 6px; }
        .badge-rp { background: #1E1F2C; padding: 6px 16px; border-radius: 60px; font-size: 0.8rem; font-weight: 600; color: #FFD966; border: 1px solid rgba(255,215,0,0.3); }
        .forum-nav { padding: 16px 32px; background: #0C0E14; display: flex; flex-wrap: wrap; gap: 28px; border-bottom: 1px solid #20232E; }
        .forum-nav a { color: #C0C9E0; text-decoration: none; font-weight: 600; transition: 0.2s; display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }
        .forum-nav a i { color: #FFD966; }
        .forum-nav a:hover, .forum-nav a.active { color: #FFD966; }
        .forum-main { display: flex; flex-wrap: wrap; padding: 28px 32px; gap: 32px; }
        .content-left { flex: 2.2; min-width: 260px; }
        .content-right { flex: 1.2; min-width: 260px; }
        .section-card { background: #13161F; border-radius: 20px; margin-bottom: 28px; border: 1px solid #232732; overflow: hidden; }
        .section-title { background: #1A1E2A; padding: 14px 22px; font-weight: 700; font-size: 1.2rem; border-left: 4px solid #FFD700; display: flex; align-items: center; gap: 10px; }
        .section-title i { color: #FFD966; }
        .category-item { display: flex; justify-content: space-between; align-items: center; padding: 14px 22px; border-bottom: 1px solid #20232F; flex-wrap: wrap; gap: 10px; cursor: pointer; transition: 0.1s; }
        .category-item:hover { background: #191E2B; }
        .cat-info h3 { font-size: 1rem; font-weight: 600; margin-bottom: 4px; }
        .cat-info p { font-size: 0.75rem; color: #8A94B0; }
        .cat-stats { font-size: 0.75rem; background: #0C0F18; padding: 4px 12px; border-radius: 40px; }
        .topics-list { padding: 0 22px; }
        .topic-item { padding: 12px 0; border-bottom: 1px solid #20232F; cursor: pointer; transition: 0.1s; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; }
        .topic-item:hover { background: #191E2B; margin: 0 -22px; padding: 12px 22px; }
        .topic-title { font-weight: 700; margin-bottom: 4px; color: #FFD966; }
        .topic-meta { font-size: 0.7rem; color: #8A94B0; }
        .topic-actions { display: flex; gap: 10px; }
        .topic-actions i { cursor: pointer; color: #8A94B0; transition: 0.2s; font-size: 0.9rem; }
        .topic-actions i:hover { color: #FFD966; }
        .empty-topics { padding: 28px 22px; text-align: center; color: #8A94B0; }
        .forum-footer { background: #090B10; padding: 20px 32px; border-top: 1px solid #20232E; font-size: 0.75rem; text-align: center; color: #6F7A98; }
        .thread-view { background: #13161F; border-radius: 20px; padding: 24px; margin-bottom: 28px; }
        .thread-title { font-size: 1.5rem; font-weight: 700; margin-bottom: 16px; color: #FFD966; }
        .thread-meta { font-size: 0.8rem; color: #8A94B0; margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid #232732; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        .thread-content { color: #C0C9E0; line-height: 1.6; margin-bottom: 24px; }
        .back-btn { background: #1E232F; border: none; color: #FFD966; padding: 8px 16px; border-radius: 20px; cursor: pointer; margin-bottom: 20px; display: inline-block; }
        .back-btn:hover { background: #2A3040; }
        .create-topic-btn { background: #FFD96620; border: 1px solid #FFD966; color: #FFD966; padding: 10px 20px; border-radius: 30px; cursor: pointer; margin-top: 16px; font-weight: 600; display: inline-block; }
        .create-topic-btn:hover { background: #FFD96630; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: #13161F; padding: 28px; border-radius: 24px; width: 90%; max-width: 500px; border: 1px solid #FFD966; }
        .modal-content input, .modal-content textarea { width: 100%; padding: 10px; margin: 10px 0; background: #1E232F; border: 1px solid #232732; border-radius: 12px; color: white; font-family: 'Inter', sans-serif; }
        .modal-content button { background: #FFD966; color: #0B0C10; border: none; padding: 10px 20px; border-radius: 30px; cursor: pointer; font-weight: bold; margin-top: 10px; margin-right: 10px; }
        .modal-content button.cancel { background: #3A3F55; color: white; }
        .close-modal { float: right; font-size: 28px; cursor: pointer; color: #FFD966; }
        .server-card { background: linear-gradient(135deg, #1A1E2A, #13161F); border-radius: 16px; padding: 20px; margin-bottom: 16px; border: 1px solid #FFD96640; cursor: pointer; transition: 0.2s; }
        .server-card:hover { border-color: #FFD966; background: #1E2436; transform: translateY(-2px); }
        .server-name { font-size: 1.3rem; font-weight: 800; color: #FFD966; margin-bottom: 8px; }
        .server-status { font-size: 0.75rem; color: #4CAF50; margin-bottom: 12px; }
        .server-desc { font-size: 0.8rem; color: #9AA4BF; }
        .server-subforums { display: flex; gap: 12px; margin-top: 16px; flex-wrap: wrap; }
        .server-sub { background: #0C0F18; padding: 8px 16px; border-radius: 30px; font-size: 0.8rem; cursor: pointer; border: 1px solid #FFD96640; transition: 0.2s; }
        .server-sub:hover { background: #FFD96620; border-color: #FFD966; }
        .voice-card { background: #13161F; border-radius: 20px; padding: 18px; border: 1px solid #2C3040; margin-bottom: 28px; text-align: center; }
        .loading { text-align: center; padding: 50px; color: #FFD966; }
        @media (max-width: 800px) { .forum-main { flex-direction: column; } }
    </style>
</head>
<body>
<div class="forum-container">
    <div class="forum-header">
        <div class="header-top">
            <div class="logo-area">
                <h1><i class="fas fa-city"></i> RUSSIA SOUL RP | RSRP</h1>
                <p>Криминальная Москва · GTA 5 RolePlay · Реализм 24/7</p>
            </div>
            <div class="badge-rp"><i class="fas fa-shield-alt"></i> Официальный форум</div>
        </div>
    </div>
    <div class="forum-nav">
        <a data-page="main"><i class="fas fa-home"></i> Главная</a>
        <a data-page="support_tech"><i class="fas fa-headset"></i> Техподдержка</a>
        <a data-page="complaints"><i class="fas fa-file-alt"></i> Жалобы и заявления</a>
    </div>
    
    <div id="main-content" class="forum-main"><div class="loading"><i class="fas fa-spinner fa-pulse"></i> Загрузка...</div></div>
    
    <div class="forum-footer">
        RussiaSoul RP · Криминальная Москва 2026 · <span style="color:#FFD966;">Официальный форум RSRP</span>
    </div>
</div>

<div id="topicModal" class="modal">
    <div class="modal-content">
        <span class="close-modal">&times;</span>
        <h3 style="color:#FFD966;" id="modalTitle">Создать новую тему</h3>
        <input type="text" id="topicTitle" placeholder="Название темы">
        <textarea id="topicContent" rows="5" placeholder="Текст сообщения..."></textarea>
        <button id="submitTopicBtn">Сохранить</button>
        <button id="cancelModalBtn" class="cancel">Отмена</button>
    </div>
</div>

<script>
    // ⚠️ ВАЖНО: ЗАМЕНИТЕ ЭТИ ЗНАЧЕНИЯ НА ВАШИ!
    // Ваш Google Sheet ID (из ссылки: docs.google.com/spreadsheets/d/ВАШ_ID_ТАБЛИЦЫ/edit)
    const SPREADSHEET_ID = 'ВАШ_ID_ТАБЛИЦЫ';  // <--- СЮДА ВСТАВЬТЕ ID ВАШЕЙ ТАБЛИЦЫ
    
    // Имя листа (по умолчанию 'Лист1' или 'Sheet1')
    const SHEET_NAME = 'Лист1';
    
    var DISQUS_SHORTNAME = "rsrp-forum";
    var currentEditCategory = null;
    var currentEditTopicId = null;
    
    // Структура форума
    var forumSections = [
        { id: "rules_common", name: "Общие правила проекта", desc: "Основные правила поведения на сервере", icon: "fas fa-gavel" },
        { id: "rules_criminal", name: "Общие правила криминальных организаций", desc: "Правила для банд, мафии и криминала", icon: "fas fa-skull" },
        { id: "rules_gov", name: "Общие правила государственных организаций", desc: "Правила для полиции, мэрии, госструктур", icon: "fas fa-building" }
    ];
    
    var serverKhimkiSubs = [
        { id: "khimki_criminal", name: "Криминальные организации", desc: "Банды, мафия, криминальные семьи", icon: "fas fa-mask" },
        { id: "khimki_gov", name: "Государственные организации", desc: "Полиция, мэрия, скорая, пожарные", icon: "fas fa-landmark" }
    ];
    
    var techSupport = [
        { id: "tech_help", name: "Помощь", desc: "Вопросы по игре, помощь новичкам", icon: "fas fa-question-circle" },
        { id: "tech_bugs", name: "Сообщить о баге", desc: "Ошибки, глитчи, проблемы с сервером", icon: "fas fa-bug" },
        { id: "tech_support", name: "Техподдержка", desc: "Связь с администрацией по тех. вопросам", icon: "fas fa-headset" }
    ];
    
    var complaints = [
        { id: "complaint_admin", name: "Жалобы на администрацию", desc: "Нарушения со стороны админов", icon: "fas fa-user-shield" },
        { id: "complaint_players", name: "Жалобы на игроков", desc: "Нарушения правил игроками", icon: "fas fa-users" },
        { id: "complaint_leaders", name: "Жалобы на лидеров", desc: "Нарушения лидеров организаций", icon: "fas fa-crown" },
        { id: "amnesty", name: "Заявление на амнистию", desc: "Просьба о смягчении наказания", icon: "fas fa-hand-peace" },
        { id: "moderator_app", name: "Заявление на пост модератора", desc: "Подать заявку в модерацию", icon: "fas fa-user-tie" },
        { id: "leader_app", name: "Заявление на пост лидера", desc: "Подать заявку на лидерство", icon: "fas fa-chart-line" }
    ];
    
    // Функция для загрузки данных из Google Sheets
    async function loadTopicsFromSheet() {
        try {
            const url = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:json&sheet=${SHEET_NAME}`;
            const response = await fetch(url);
            const text = await response.text();
            const jsonText = text.substring(47).slice(0, -2);
            const data = JSON.parse(jsonText);
            
            const rows = data.table.rows;
            const topics = {};
            
            // Инициализируем пустые массивы для всех категорий
            const allCategories = [...forumSections, ...serverKhimkiSubs, ...techSupport, ...complaints];
            allCategories.forEach(cat => { topics[cat.id] = []; });
            
            // Парсим строки (начиная с 1, так как строка 0 - заголовки)
            for (let i = 1; i < rows.length; i++) {
                const row = rows[i].c;
                if (!row || !row[0] || !row[0].v) continue;
                
                const topic = {
                    id: row[0]?.v || '',
                    category: row[1]?.v || '',
                    title: row[2]?.v || 'Без названия',
                    author: row[3]?.v || 'Аноним',
                    date: row[4]?.v || new Date().toLocaleDateString(),
                    content: row[5]?.v || '',
                    replies: row[6]?.v || 0
                };
                
                if (topics[topic.category]) {
                    topics[topic.category].push(topic);
                }
            }
            
            return topics;
        } catch (error) {
            console.error('Ошибка загрузки:', error);
            return {};
        }
    }
    
    // Сохранение темы в Google Sheets (через Google Apps Script)
    async function saveTopicToSheet(category, topicId, title, author, content, isEdit = false, oldTopicId = null) {
        // Для работы записи нужен Google Apps Script (Web App)
        // Временно показываем сообщение
        alert('Для сохранения тем необходимо настроить Google Apps Script. Сейчас темы сохраняются только локально.\n\nИнструкцию я напишу ниже!');
        
        // Возвращаем заглушку
        return false;
    }
    
    // Временное локальное хранилище (пока не настроен Apps Script)
    var localTopicsBackup = {};
    
    function loadLocalBackup() {
        const saved = localStorage.getItem('rsrp_sheet_backup');
        if (saved) {
            localTopicsBackup = JSON.parse(saved);
        }
    }
    
    function saveLocalBackup() {
        localStorage.setItem('rsrp_sheet_backup', JSON.stringify(localTopicsBackup));
    }
    
    function getTopics() {
        if (Object.keys(localTopicsBackup).length === 0) {
            // Инициализация пустыми массивами
            const allCategories = [...forumSections, ...serverKhimkiSubs, ...techSupport, ...complaints];
            allCategories.forEach(cat => { localTopicsBackup[cat.id] = []; });
        }
        return localTopicsBackup;
    }
    
    function saveTopic(categoryId, topicId, title, content, isEdit = false) {
        let topics = getTopics();
        if (!topics[categoryId]) topics[categoryId] = [];
        
        if (isEdit && topicId) {
            const index = topics[categoryId].findIndex(t => t.id == topicId);
            if (index !== -1) {
                topics[categoryId][index].title = title;
                topics[categoryId][index].content = content;
            }
        } else {
            const newTopic = {
                id: 'topic_' + Date.now(),
                category: categoryId,
                title: title,
                author: 'Игрок',
                date: new Date().toLocaleDateString(),
                content: content,
                replies: 0
            };
            topics[categoryId].push(newTopic);
        }
        saveLocalBackup();
        return true;
    }
    
    function deleteTopicFromStorage(categoryId, topicId) {
        let topics = getTopics();
        if (topics[categoryId]) {
            const index = topics[categoryId].findIndex(t => t.id == topicId);
            if (index !== -1) {
                topics[categoryId].splice(index, 1);
                saveLocalBackup();
                return true;
            }
        }
        return false;
    }
    
    function getTopicsByCategory(categoryId) {
        const topics = getTopics();
        return topics[categoryId] || [];
    }
    
    function loadDisqus(threadId, threadTitle) {
        if (window.DISQUS) {
            window.DISQUS.reset({
                reload: true,
                config: function () {
                    this.page.identifier = threadId;
                    this.page.url = window.location.href.split('#')[0] + '#!' + threadId;
                    this.page.title = threadTitle;
                }
            });
        } else {
            var dsq = document.createElement('script');
            dsq.type = 'text/javascript';
            dsq.async = true;
            dsq.src = '//' + DISQUS_SHORTNAME + '.disqus.com/embed.js';
            document.getElementsByTagName('head')[0].appendChild(dsq);
        }
    }
    
    function renderTopicsList(categoryId, title, backCallback, categoryName) {
        const topics = getTopicsByCategory(categoryId);
        const container = document.getElementById('main-content');
        let html = '<div class="content-left" style="width:100%">';
        html += `<button class="back-btn" onclick="(${backCallback.toString()})()"><i class="fas fa-arrow-left"></i> Назад</button>`;
        html += `<div class="section-card"><div class="section-title"><i class="fas fa-folder-open"></i> ${title}</div><div class="topics-list">`;
        
        if (topics.length === 0) {
            html += '<div class="empty-topics"><i class="fas fa-inbox"></i><p>Нет тем в этом разделе</p></div>';
        } else {
            topics.forEach(topic => {
                html += `<div class="topic-item" data-topic="${topic.id}" data-title="${topic.title}">`;
                html += `<div style="flex:1"><div class="topic-title">${topic.title}</div>`;
                html += `<div class="topic-meta"><i class="fas fa-user"></i> ${topic.author} · ${topic.date} · ответов: ${topic.replies}</div></div>`;
                html += `<div class="topic-actions">`;
                html += `<i class="fas fa-edit" title="Редактировать" data-action="edit"></i>`;
                html += `<i class="fas fa-trash-alt" title="Удалить" data-action="delete"></i>`;
                html += `</div></div>`;
            });
        }
        
        html += `</div><div style="padding:16px 22px;"><button class="create-topic-btn" data-cat="${categoryId}"><i class="fas fa-plus"></i> Создать тему</button></div></div></div>`;
        container.innerHTML = html;
        
        document.querySelectorAll('.topic-item').forEach(el => {
            const topicId = el.dataset.topic;
            const topicTitle = el.dataset.title;
            el.querySelector('.topic-title')?.addEventListener('click', (e) => {
                e.stopPropagation();
                showThread(categoryId, topicId, topicTitle);
            });
            el.querySelector('[data-action="edit"]')?.addEventListener('click', (e) => {
                e.stopPropagation();
                editTopic(categoryId, topicId);
            });
            el.querySelector('[data-action="delete"]')?.addEventListener('click', (e) => {
                e.stopPropagation();
                if (confirm('Удалить тему?')) {
                    deleteTopicFromStorage(categoryId, topicId);
                    renderTopicsList(categoryId, title, backCallback, categoryName);
                }
            });
        });
        document.querySelector('.create-topic-btn')?.addEventListener('click', (e) => openCreateModal(e.target.dataset.cat, categoryName, backCallback));
    }
    
    function showThread(categoryId, threadId, threadTitle) {
        const topics = getTopicsByCategory(categoryId);
        const topic = topics.find(t => t.id == threadId);
        const container = document.getElementById('main-content');
        let html = '<div class="content-left" style="width:100%">';
        html += '<button class="back-btn" onclick="location.reload()"><i class="fas fa-arrow-left"></i> Назад</button>';
        html += '<div class="thread-view">';
        if (topic) {
            html += `<div class="thread-title">${topic.title}</div>`;
            html += `<div class="thread-meta"><span><i class="fas fa-user"></i> ${topic.author} · ${topic.date}</span>`;
            html += `<div class="topic-actions"><i class="fas fa-edit" title="Редактировать" id="editThreadBtn" style="cursor:pointer;"></i>`;
            html += `<i class="fas fa-trash-alt" title="Удалить" id="deleteThreadBtn" style="cursor:pointer; margin-left:12px;"></i></div></div>`;
            html += `<div class="thread-content">${topic.content.replace(/\n/g, '<br>')}</div>`;
        }
        html += '<div id="disqus_thread"></div></div></div>';
        container.innerHTML = html;
        
        if (topic) {
            document.getElementById('editThreadBtn')?.addEventListener('click', () => editTopic(categoryId, threadId));
            document.getElementById('deleteThreadBtn')?.addEventListener('click', () => {
                if (confirm('Удалить тему?')) {
                    deleteTopicFromStorage(categoryId, threadId);
                    showMainPage();
                }
            });
        }
        loadDisqus(threadId, threadTitle);
    }
    
    function editTopic(categoryId, topicId) {
        const topics = getTopicsByCategory(categoryId);
        const topic = topics.find(t => t.id == topicId);
        if (topic) {
            currentEditCategory = categoryId;
            currentEditTopicId = topicId;
            document.getElementById('modalTitle').innerText = 'Редактировать тему';
            document.getElementById('topicTitle').value = topic.title;
            document.getElementById('topicContent').value = topic.content;
            document.getElementById('topicModal').style.display = 'flex';
        }
    }
    
    function openCreateModal(categoryId, categoryName, backCallback) {
        currentEditCategory = categoryId;
        currentEditTopicId = null;
        document.getElementById('modalTitle').innerText = 'Создать новую тему';
        document.getElementById('topicTitle').value = '';
        document.getElementById('topicContent').value = '';
        document.getElementById('topicModal').style.display = 'flex';
        window.currentBackCallback = backCallback;
    }
    
    function closeModal() {
        document.getElementById('topicModal').style.display = 'none';
        currentEditCategory = null;
        currentEditTopicId = null;
    }
    
    function showMainPage() {
        loadLocalBackup();
        const container = document.getElementById('main-content');
        let html = '<div class="content-left">';
        
        html += '<div class="section-card">';
        html += '<div class="section-title"><i class="fas fa-server"></i> Игровые сервера</div>';
        html += '<div class="server-card" id="khimkiServerBtn">';
        html += '<div class="server-name"><i class="fas fa-star-of-life"></i> Сервер №1 | Химки</div>';
        html += '<div class="server-status"><i class="fas fa-circle" style="color:#4CAF50; font-size:0.6rem;"></i> Онлайн</div>';
        html += '<div class="server-desc">Основной сервер проекта. Криминальная Москва, высокий реализм.</div>';
        html += '<div class="server-subforums">';
        html += '<div class="server-sub" data-sub="khimki_criminal"><i class="fas fa-mask"></i> Криминальные организации</div>';
        html += '<div class="server-sub" data-sub="khimki_gov"><i class="fas fa-landmark"></i> Государственные организации</div>';
        html += '</div></div></div>';
        
        html += '<div class="section-card">';
        html += '<div class="section-title"><i class="fas fa-layer-group"></i> Разделы форума</div>';
        html += '<div class="category-list">';
        forumSections.forEach(section => {
            const topics = getTopicsByCategory(section.id);
