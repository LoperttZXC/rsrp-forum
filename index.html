<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RussiaSoulRP | RSRP — Форум с комментариями</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0B0C10; font-family: 'Inter', sans-serif; color: #E0E4F0; padding: 24px 20px; }
        .forum-container { max-width: 1320px; margin: 0 auto; background: #0F1117; border-radius: 28px; overflow: hidden; border: 1px solid rgba(255,215,0,0.15); }
        .forum-header { background: linear-gradient(135deg, #0A0C12 0%, #11141C 100%); padding: 28px 32px; border-bottom: 2px solid #FFD700; }
        .header-top { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 20px; }
        .logo-area h1 { font-size: 2.2rem; font-weight: 800; background: linear-gradient(135deg, #FFD966, #FFB347); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .logo-area p { font-size: 0.85rem; color: #9AA4BF; margin-top: 6px; }
        .badge-rp { background: #1E1F2C; padding: 6px 16px; border-radius: 60px; font-size: 0.8rem; font-weight: 600; color: #FFD966; border: 1px solid rgba(255,215,0,0.3); }
        .forum-nav { padding: 16px 32px; background: #0C0E14; display: flex; flex-wrap: wrap; gap: 28px; border-bottom: 1px solid #20232E; }
        .forum-nav a { color: #C0C9E0; text-decoration: none; font-weight: 600; transition: 0.2s; display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }
        .forum-nav a i { color: #FFD966; }
        .forum-nav a:hover, .forum-nav a.active { color: #FFD966; }
        .forum-main { display: flex; flex-wrap: wrap; padding: 28px 32px; gap: 32px; }
        .content-left { flex: 2.2; min-width: 260px; }
        .content-right { flex: 1.2; min-width: 260px; }
        .section-card { background: #13161F; border-radius: 20px; margin-bottom: 28px; border: 1px solid #232732; overflow: hidden; }
        .section-title { background: #1A1E2A; padding: 14px 22px; font-weight: 700; font-size: 1.2rem; border-left: 4px solid #FFD700; display: flex; align-items: center; gap: 10px; cursor: pointer; }
        .section-title i { color: #FFD966; }
        .category-item { display: flex; justify-content: space-between; align-items: center; padding: 14px 22px; border-bottom: 1px solid #20232F; flex-wrap: wrap; gap: 10px; cursor: pointer; transition: 0.1s; }
        .category-item:hover { background: #191E2B; }
        .cat-info h3 { font-size: 1rem; font-weight: 600; margin-bottom: 4px; }
        .cat-info p { font-size: 0.75rem; color: #8A94B0; }
        .cat-stats { font-size: 0.75rem; background: #0C0F18; padding: 4px 12px; border-radius: 40px; }
        .topics-list { padding: 0 22px; }
        .topic-item { padding: 12px 0; border-bottom: 1px solid #20232F; cursor: pointer; transition: 0.1s; }
        .topic-item:hover { background: #191E2B; margin: 0 -22px; padding: 12px 22px; }
        .topic-title { font-weight: 700; margin-bottom: 4px; color: #FFD966; }
        .topic-meta { font-size: 0.7rem; color: #8A94B0; }
        .empty-topics { padding: 28px 22px; text-align: center; color: #8A94B0; }
        .forum-footer { background: #090B10; padding: 20px 32px; border-top: 1px solid #20232E; font-size: 0.75rem; text-align: center; color: #6F7A98; }
        .thread-view { background: #13161F; border-radius: 20px; padding: 24px; margin-bottom: 28px; }
        .thread-title { font-size: 1.5rem; font-weight: 700; margin-bottom: 16px; color: #FFD966; }
        .thread-meta { font-size: 0.8rem; color: #8A94B0; margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid #232732; }
        .back-btn { background: #1E232F; border: none; color: #FFD966; padding: 8px 16px; border-radius: 20px; cursor: pointer; margin-bottom: 20px; display: inline-block; }
        .back-btn:hover { background: #2A3040; }
        .create-topic-btn { background: #FFD96620; border: 1px solid #FFD966; color: #FFD966; padding: 10px 20px; border-radius: 30px; cursor: pointer; margin-top: 16px; font-weight: 600; }
        .create-topic-btn:hover { background: #FFD96630; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: #13161F; padding: 28px; border-radius: 24px; width: 90%; max-width: 500px; border: 1px solid #FFD966; }
        .modal-content input, .modal-content textarea { width: 100%; padding: 10px; margin: 10px 0; background: #1E232F; border: 1px solid #232732; border-radius: 12px; color: white; font-family: 'Inter', sans-serif; }
        .modal-content button { background: #FFD966; color: #0B0C10; border: none; padding: 10px 20px; border-radius: 30px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        .close-modal { float: right; font-size: 28px; cursor: pointer; color: #FFD966; }
        @media (max-width: 800px) { .forum-main { flex-direction: column; } }
    </style>
</head>
<body>
<div class="forum-container">
    <div class="forum-header">
        <div class="header-top">
            <div class="logo-area">
                <h1><i class="fas fa-city"></i> RUSSIA SOUL RP | RSRP</h1>
                <p>Криминальная Москва · GTA 5 RolePlay · Реализм 24/7</p>
            </div>
            <div class="badge-rp"><i class="fas fa-shield-alt"></i> Официальный форум</div>
        </div>
    </div>
    <div class="forum-nav">
        <a data-page="main"><i class="fas fa-home"></i> Главная</a>
        <a data-page="rules"><i class="fas fa-gavel"></i> Правила</a>
        <a data-page="support"><i class="fas fa-headset"></i> Техподдержка</a>
    </div>
    
    <div id="main-content" class="forum-main">
        <!-- Содержимое загружается -->
    </div>
    
    <div class="forum-footer">
        RussiaSoul RP · Криминальная Москва 2026 · <span style="color:#FFD966;">Официальный форум RSRP</span>
    </div>
</div>

<!-- Модальное окно для создания темы -->
<div id="createTopicModal" class="modal">
    <div class="modal-content">
        <span class="close-modal">&times;</span>
        <h3 style="color:#FFD966;">Создать новую тему</h3>
        <input type="text" id="newTopicTitle" placeholder="Название темы">
        <textarea id="newTopicContent" rows="4" placeholder="Текст сообщения..."></textarea>
        <button id="submitTopicBtn">Создать тему</button>
    </div>
</div>

<script>
    // Ваш shortname из Disqus
    var DISQUS_SHORTNAME = "rsrp-forum";
    
    // Данные форума (темы сохраняются в localStorage)
    var forumData = {
        categories: [
            { id: "general", name: "Общий чат", desc: "Обсуждение всего, что связано с сервером", icon: "fas fa-comment" },
            { id: "criminal", name: "Криминальный мир", desc: "Банды, сделки, разборки", icon: "fas fa-mask" },
            { id: "gov", name: "Государство", desc: "Полиция, мэрия, законы", icon: "fas fa-building" },
            { id: "support", name: "Техподдержка", desc: "Баги, жалобы, вопросы", icon: "fas fa-headset" }
        ],
        topics: {}
    };
    
    // Загрузка тем из localStorage
    function loadTopicsFromStorage() {
        var saved = localStorage.getItem("rsrp_forum_topics");
        if (saved) {
            forumData.topics = JSON.parse(saved);
        } else {
            // Стартовые темы
            forumData.topics = {
                general: [
                    { id: "topic1", title: "Добро пожаловать на RSRP!", author: "Администрация", date: new Date().toLocaleDateString(), replies: 0, content: "Добро пожаловать на форум RussiaSoul RP!" },
                    { id: "topic2", title: "Правила поведения на сервере", author: "Модератор", date: new Date().toLocaleDateString(), replies: 0, content: "Ознакомьтесь с правилами проекта." }
                ],
                criminal: [],
                gov: [],
                support: []
            };
        }
    }
    
    // Сохранение тем в localStorage
    function saveTopicsToStorage() {
        localStorage.setItem("rsrp_forum_topics", JSON.stringify(forumData.topics));
    }
    
    function loadDisqus(threadId, threadTitle) {
        if (window.DISQUS) {
            window.DISQUS.reset({
                reload: true,
                config: function () {
                    this.page.identifier = threadId;
                    this.page.url = window.location.href.split('#')[0] + '#!' + threadId;
                    this.page.title = threadTitle;
                }
            });
        } else {
            var dsq = document.createElement('script');
            dsq.type = 'text/javascript';
            dsq.async = true;
            dsq.src = '//' + DISQUS_SHORTNAME + '.disqus.com/embed.js';
            (document.getElementsByTagName('head')[0] || document.getElementsByTagName('body')[0]).appendChild(dsq);
        }
    }
    
    function showMainPage() {
        loadTopicsFromStorage();
        var container = document.getElementById('main-content');
        var categoriesHtml = '<div class="content-left">';
        
        categoriesHtml += '<div class="section-card">';
        categoriesHtml += '<div class="section-title"><i class="fas fa-server"></i> Разделы форума</div>';
        categoriesHtml += '<div class="category-list">';
        
        forumData.categories.forEach(function(cat) {
            var topicCount = forumData.topics[cat.id] ? forumData.topics[cat.id].length : 0;
            categoriesHtml += '<div class="category-item" data-category="' + cat.id + '">';
            categoriesHtml += '<div class="cat-info"><h3><i class="' + cat.icon + '"></i> ' + cat.name + '</h3><p>' + cat.desc + '</p></div>';
            categoriesHtml += '<div class="cat-stats"><i class="fas fa-file-alt"></i> Тем: ' + topicCount + '</div>';
            categoriesHtml += '</div>';
        });
        
        categoriesHtml += '</div></div>';
        
        // Последние темы
        categoriesHtml += '<div class="section-card">';
        categoriesHtml += '<div class="section-title"><i class="fas fa-clock"></i> Последние темы</div>';
        categoriesHtml += '<div class="topics-list">';
        
        var allTopics = [];
        for (var cat in forumData.topics) {
            if (forumData.topics[cat]) {
                forumData.topics[cat].forEach(function(topic) {
                    allTopics.push({category: cat, topic: topic});
                });
            }
        }
        allTopics.reverse();
        if (allTopics.length === 0) {
            categoriesHtml += '<div class="empty-topics"><i class="fas fa-inbox"></i><p>Нет тем. Создайте первую!</p></div>';
        } else {
            allTopics.slice(0, 5).forEach(function(item) {
                categoriesHtml += '<div class="topic-item" data-category="' + item.category + '" data-topic="' + item.topic.id + '" data-title="' + item.topic.title + '">';
                categoriesHtml += '<div class="topic-title">' + item.topic.title + '</div>';
                categoriesHtml += '<div class="topic-meta"><i class="fas fa-user"></i> ' + item.topic.author + ' · <i class="fas fa-clock"></i> ' + item.topic.date + ' · <i class="fas fa-reply"></i> ' + item.topic.replies + ' ответов</div>';
                categoriesHtml += '</div>';
            });
        }
        
        categoriesHtml += '</div>';
        categoriesHtml += '<div style="padding: 16px 22px;"><button class="create-topic-btn" id="globalCreateTopicBtn"><i class="fas fa-plus"></i> Создать тему</button></div>';
        categoriesHtml += '</div></div>';
        
        categoriesHtml += '<div class="content-right">';
        categoriesHtml += '<div class="stats-card"><div><i class="fas fa-chart-line"></i> <strong>Статистика</strong></div>';
        categoriesHtml += '<div style="margin-top: 16px;">Всего тем: ' + allTopics.length + '<br>Всего разделов: ' + forumData.categories.length + '</div></div>';
        categoriesHtml += '<div class="voice-card"><i class="fas fa-microphone-alt"></i> <strong>Голосовое объединение</strong><div style="margin-top: 10px; color:#8A94B0;">Подключитесь к Discord</div></div>';
        categoriesHtml += '</div>';
        
        container.innerHTML = categoriesHtml;
        
        document.querySelectorAll('.category-item[data-category]').forEach(function(el) {
            el.addEventListener('click', function() { showCategory(this.dataset.category); });
        });
        document.querySelectorAll('.topic-item').forEach(function(el) {
            el.addEventListener('click', function() { 
                showThread(this.dataset.category, this.dataset.topic, this.dataset.title);
            });
        });
        var createBtn = document.getElementById('globalCreateTopicBtn');
        if (createBtn) {
            createBtn.addEventListener('click', function() { openCreateModal(null); });
        }
    }
    
    function showCategory(categoryId) {
        var category = forumData.categories.find(function(c) { return c.id == categoryId; });
        var topics = forumData.topics[categoryId] || [];
        var container = document.getElementById('main-content');
        
        var html = '<div class="content-left" style="width:100%">';
        html += '<button class="back-btn" onclick="showMainPage()"><i class="fas fa-arrow-left"></i> Назад к разделам</button>';
        html += '<div class="section-card"><div class="section-title"><i class="' + category.icon + '"></i> ' + category.name + '</div>';
        html += '<div class="topics-list">';
        
        if (topics.length === 0) {
            html += '<div class="empty-topics"><i class="fas fa-inbox"></i><p>В этом разделе пока нет тем.</p><p style="font-size:0.75rem">Будьте первым!</p></div>';
        } else {
            topics.forEach(function(topic) {
                html += '<div class="topic-item" data-topic="' + topic.id + '" data-title="' + topic.title + '">';
                html += '<div class="topic-title">' + topic.title + '</div>';
                html += '<div class="topic-meta"><i class="fas fa-user"></i> ' + topic.author + ' · <i class="fas fa-clock"></i> ' + topic.date + ' · <i class="fas fa-reply"></i> ' + topic.replies + ' ответов</div>';
                html += '</div>';
            });
        }
        
        html += '</div>';
        html += '<div style="padding: 16px 22px;"><button class="create-topic-btn" data-category="' + categoryId + '"><i class="fas fa-plus"></i> Создать тему в этом разделе</button></div>';
        html += '</div></div>';
        container.innerHTML = html;
        
        document.querySelectorAll('.topic-item').forEach(function(el) {
            el.addEventListener('click', function() { 
                showThread(categoryId, this.dataset.topic, this.dataset.title);
            });
        });
        var createBtn = document.querySelector('.create-topic-btn');
        if (createBtn) {
            createBtn.addEventListener('click', function() { openCreateModal(categoryId); });
        }
    }
    
    function showThread(categoryId, threadId, threadTitle) {
        var topic = null;
        if (forumData.topics[categoryId]) {
            topic = forumData.topics[categoryId].find(function(t) { return t.id == threadId; });
        }
        var container = document.getElementById('main-content');
        var html = '<div class="content-left" style="width:100%">';
        html += '<button class="back-btn" onclick="showCategory(\'' + categoryId + '\')"><i class="fas fa-arrow-left"></i> Назад к темам</button>';
        html += '<div class="thread-view">';
        if (topic && topic.content) {
            html += '<div style="background:#1A1E2A; padding:16px; border-radius:16px; margin-bottom:24px;">';
            html += '<div class="thread-title">' + topic.title + '</div>';
            html += '<div class="thread-meta"><i class="fas fa-user"></i> ' + topic.author + ' · <i class="fas fa-clock"></i> ' + topic.date + '</div>';
            html += '<div style="color:#C0C9E0; line-height:1.6;">' + topic.content + '</div>';
            html += '</div>';
        }
        html += '<div id="disqus_thread"></div>';
        html += '</div></div>';
        container.innerHTML = html;
        
        loadDisqus(threadId, threadTitle);
    }
    
    function openCreateModal(categoryId) {
        var modal = document.getElementById('createTopicModal');
        var currentCategory = categoryId;
        modal.style.display = 'flex';
        
        var submitBtn = document.getElementById('submitTopicBtn');
        var newSubmit = submitBtn.cloneNode(true);
        submitBtn.parentNode.replaceChild(newSubmit, submitBtn);
        
        newSubmit.onclick = function() {
            var title = document.getElementById('newTopicTitle').value.trim();
            var content = document.getElementById('newTopicContent').value.trim();
            if (!title) {
                alert('Введите название темы');
                return;
            }
            if (!content) {
                alert('Введите текст сообщения');
                return;
            }
            
            var targetCategory = currentCategory;
            if (!targetCategory) {
                targetCategory = 'general';
            }
            
            if (!forumData.topics[targetCategory]) {
                forumData.topics[targetCategory] = [];
            }
            
            var newId = 'topic_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6);
            var newTopic = {
                id: newId,
                title: title,
                author: 'Пользователь',
                date: new Date().toLocaleDateString(),
                replies: 0,
                content: content
            };
            
            forumData.topics[targetCategory].push(newTopic);
            saveTopicsToStorage();
            
            modal.style.display = 'none';
            document.getElementById('newTopicTitle').value = '';
            document.getElementById('newTopicContent').value = '';
            
            if (categoryId) {
                showCategory(categoryId);
            } else {
                showMainPage();
            }
        };
    }
    
    window.showMainPage = showMainPage;
    window.showCategory = showCategory;
    window.showThread = showThread;
    window.openCreateModal = openCreateModal;
    
    document.querySelector('.close-modal').onclick = function() {
        document.getElementById('createTopicModal').style.display = 'none';
    };
    window.onclick = function(e) {
        if (e.target == document.getElementById('createTopicModal')) {
            document.getElementById('createTopicModal').style.display = 'none';
        }
    };
    
    loadTopicsFromStorage();
    showMainPage();
</script>
</body>
</html>
